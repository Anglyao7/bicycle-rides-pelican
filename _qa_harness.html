<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>QA harness</title>
<style>
  html,body{margin:0;background:#222;overflow:hidden}
  #wrap{transform-origin:0 0}
  iframe{border:0;display:block;background:#0B1C22}
</style></head>
<body>
<div id="wrap"><iframe id="f"></iframe></div>
<script>
  var q=new URLSearchParams(location.search);
  var w=+(q.get('w')||1440), h=+(q.get('h')||920), s=+(q.get('s')||0.55);
  var sec=q.get('sec')||'studio';
  var wrap=document.getElementById('wrap'), f=document.getElementById('f');
  wrap.style.transform='scale('+s+')';
  f.style.width=w+'px'; f.style.height=h+'px';
  f.src='bicycle-rides-pelican.html'+(sec==='top'?'':'#'+sec);
</script>
</body></html>
